<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">Response lengths across four held-out support prompts</title>
<desc id="desc">Cancellation: base 25 words, adapted 12 words. Missing package: base 64 words, adapted 38 words. Refund status: base 68 words, adapted 11 words. Delivery guarantee: base 54 words, adapted 12 words.</desc>
<rect width="900" height="440" rx="20" fill="#F8FAFC"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#0F172A">
<text x="28" y="42" font-size="24" font-weight="700">Response length by held-out prompt</text>
<text x="28" y="70" font-size="14" fill="#475569">Words per reply, counted by splitting the recorded text on whitespace</text>
<rect x="28" y="92" width="16" height="16" rx="3" fill="#2563EB"/><text x="52" y="105" font-size="14">Base</text>
<rect x="124" y="92" width="16" height="16" rx="3" fill="#7C3AED"/><text x="148" y="105" font-size="14">Adapted</text>
<path d="M220 125V382" stroke="#CBD5E1"/><text x="220" y="406" text-anchor="middle" font-size="13" fill="#475569">0</text>
<path d="M290 125V382" stroke="#CBD5E1"/><text x="290" y="406" text-anchor="middle" font-size="13" fill="#475569">10</text>
<path d="M360 125V382" stroke="#CBD5E1"/><text x="360" y="406" text-anchor="middle" font-size="13" fill="#475569">20</text>
<path d="M430 125V382" stroke="#CBD5E1"/><text x="430" y="406" text-anchor="middle" font-size="13" fill="#475569">30</text>
<path d="M500 125V382" stroke="#CBD5E1"/><text x="500" y="406" text-anchor="middle" font-size="13" fill="#475569">40</text>
<path d="M570 125V382" stroke="#CBD5E1"/><text x="570" y="406" text-anchor="middle" font-size="13" fill="#475569">50</text>
<path d="M640 125V382" stroke="#CBD5E1"/><text x="640" y="406" text-anchor="middle" font-size="13" fill="#475569">60</text>
<path d="M710 125V382" stroke="#CBD5E1"/><text x="710" y="406" text-anchor="middle" font-size="13" fill="#475569">70</text>
<path d="M780 125V382" stroke="#CBD5E1"/><text x="780" y="406" text-anchor="middle" font-size="13" fill="#475569">80</text>
<text x="28" y="161" font-size="15" font-weight="700">Cancellation</text>
<rect x="220" y="138" width="175" height="17" rx="3" fill="#2563EB"/><text x="403" y="152" font-size="13">25</text>
<rect x="220" y="159" width="84" height="17" rx="3" fill="#7C3AED"/><text x="312" y="173" font-size="13">12</text>
<text x="28" y="221" font-size="15" font-weight="700">Missing package</text>
<rect x="220" y="198" width="448" height="17" rx="3" fill="#2563EB"/><text x="676" y="212" font-size="13">64</text>
<rect x="220" y="219" width="266" height="17" rx="3" fill="#7C3AED"/><text x="494" y="233" font-size="13">38</text>
<text x="28" y="281" font-size="15" font-weight="700">Refund status</text>
<rect x="220" y="258" width="476" height="17" rx="3" fill="#2563EB"/><text x="704" y="272" font-size="13">68</text>
<rect x="220" y="279" width="77" height="17" rx="3" fill="#7C3AED"/><text x="305" y="293" font-size="13">11</text>
<text x="28" y="341" font-size="15" font-weight="700">Delivery guarantee</text>
<rect x="220" y="318" width="378" height="17" rx="3" fill="#2563EB"/><text x="606" y="332" font-size="13">54</text>
<rect x="220" y="339" width="84" height="17" rx="3" fill="#7C3AED"/><text x="312" y="353" font-size="13">12</text>
</g></svg>
